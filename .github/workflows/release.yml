concurrency:
  group: ${{ github.workflow }}

# Exactly one job runs per push, so each version is only ever published once:
# - Other pushes run release-it, which creates and pushes the release commit.
# - Pushes of a release commit publish that version to npm.
jobs:
  publish:
    if: "${{ startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/prepare
      - run: pnpm build
      # The registry check only guards re-runs of already-published versions.
      - run: |
          version=$(npm pkg get version | tr -d '"')
          if [ -z "$(npm view "formatly@$version" version 2>/dev/null)" ]; then
            npm publish
          fi

  release:
    if: "${{ !startsWith(github.event.head_commit.message, 'chore: release v') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.ACCESS_TOKEN }}
      - uses: ./.github/actions/prepare
      - env:
          GITHUB_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        uses: JoshuaKGoldberg/release-it-action@8ee87d0d30f97b452ef5d8aa9f4d0490eed439aa # v0.4.0

name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write
